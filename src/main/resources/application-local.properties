spring.datasource.url=jdbc:h2:file:./runtime/clyvo-v4;DB_CLOSE_ON_EXIT=FALSE
spring.config.import=optional:file:.env.local[.properties]
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.security.user.name=admin-local
spring.security.user.password=${APP_ADMIN_PASSWORD:local-only-change-me}
APP_ADMIN_USER=${CLYVO_LOCAL_ADMIN_EMAIL:admin@admin.com}
APP_ADMIN_PASSWORD=${CLYVO_LOCAL_ADMIN_PASSWORD:admin@123!}
