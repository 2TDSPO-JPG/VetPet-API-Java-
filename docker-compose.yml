services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      IOT_API_URL: ${IOT_API_URL:-http://host.docker.internal:8000}
      IOT_INTERNAL_TOKEN: ${IOT_INTERNAL_TOKEN:?Defina o mesmo token do Python}
      CLYVO_LOCAL_ADMIN_EMAIL: ${CLYVO_LOCAL_ADMIN_EMAIL:?Defina o e-mail administrativo}
      CLYVO_LOCAL_ADMIN_PASSWORD: ${CLYVO_LOCAL_ADMIN_PASSWORD:?Defina a senha administrativa}
    volumes:
      - local-data:/app/runtime
volumes:
  local-data:
